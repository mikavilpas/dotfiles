---
name: Test mise installation of "mika" tool
on:
  pull_request: ~
  push:
    branches:
      - main
  release:
    types: [published]
permissions:
  contents: read

jobs:
  test-mise-install:
    name: Test installing mika with mise
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false

      - name: Install mika with mise
        # note: the mise config in the repo might apply hooks
        run: mise install "github:mikavilpas/dotfiles@latest" --verbose

      - name: Verify mika is executable
        run: mise exec "github:mikavilpas/dotfiles@latest" -- mika --help
