name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    # https://docs.zizmor.sh/
    # https://docs.zizmor.sh/integrations/#github-actions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          advanced-security: false
          # online-audits needs a github.com token, and could be enabled later
          online-audits: false
