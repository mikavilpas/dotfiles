settings.cargo.binstall = true

settings.cargo.binstall_only = true

settings.cargo.binstall_quickinstall = true

settings.auto_install = false

settings.dotfiles.root = "~/dotfiles"

settings.dotfiles.default_mode = "symlink"

[dotfiles]
# ~/.npmrc is intentionally NOT managed here: the real ~/.npmrc holds secret
# authTokens that must never be committed, and the repo .npmrc only sets the
# default registry (which npm uses anyway). Leave the home file untouched.

# List everything explicitly. This is annoying but clear, and avoids bad
# surprises completely.
#
# Manage with:
# $ mise bootstrap dotfiles

"~/.claude/skills/*" = {}
"~/.config/aerospace" = {}
"~/.config/atuin" = {}
"~/.config/bat" = {}
"~/.config/delta" = {}
"~/.config/fd" = {}
"~/.config/fish" = {}
"~/.config/husky" = {}
"~/.config/lazygit" = {}
"~/.config/mise" = {}
"~/.config/npm/defaults.npmrc" = {}
"~/.config/nvim" = {}
"~/.config/pnpm/config.yaml" = {}
"~/.config/presenterm" = {}
"~/.config/starship.toml" = {}
"~/.config/wezterm" = {}
"~/.config/yazi" = {}
"~/.fdignore" = {}
"~/.gitattributes" = {}
"~/.gitconfig" = {}
"~/.rgignore" = {}
"~/.typos.toml" = {}
"~/.zshrc" = {}
"~/Library/Application Support/org.dystroy.bacon" = {}

# Git checkouts. Split by ownership so my own code lives in one place and can
# be iterated over in bulk:
#
#   mikavilpas/  - projects I own and release
#   other/       - forks and upstream clones I read or contribute to
#
# Work repos are not included: work code stays is not managed by my dotfiles at
# all, except for (public) tooling. The dotfiles are public source;
# aggressively limit any risk of accidentally spilling work over.
#
# Only track the repos, no need to pin versions here.
[bootstrap.repos]
"~/git/mikavilpas/blink-ripgrep.nvim" = { url = "git@github.com:mikavilpas/blink-ripgrep.nvim.git" }
"~/git/mikavilpas/easyjump.yazi" = { url = "git@github.com:mikavilpas/easyjump.yazi.git" }
"~/git/mikavilpas/incr.nvim" = { url = "git@github.com:mikavilpas/incr.nvim.git" }
"~/git/mikavilpas/mika-config" = { url = "git@github.com:mikavilpas/mika-config.git" }
"~/git/mikavilpas/my-nvim-micro-plugins.nvim" = { url = "git@github.com:mikavilpas/my-nvim-micro-plugins.nvim.git" }
"~/git/mikavilpas/neovim-action" = { url = "git@github.com:mikavilpas/neovim-action.git" }
"~/git/mikavilpas/tsugit.nvim" = { url = "git@github.com:mikavilpas/tsugit.nvim.git" }
"~/git/mikavilpas/tui-sandbox" = { url = "git@github.com:mikavilpas/tui-sandbox.git" }
"~/git/mikavilpas/yazi-action" = { url = "git@github.com:mikavilpas/yazi-action.git" }
"~/git/mikavilpas/yazi.nvim" = { url = "git@github.com:mikavilpas/yazi.nvim.git" }

#
# https://mise.jdx.dev/bootstrap/packages/brew.html
[bootstrap.packages]
# macOS only has Apple's build cannot be upgraded independently and lags
# upstream by several releases. Homebrew's git is bottled, so this is a fast
# binary install, not a build.
"brew:git" = "latest"

# yazi previewers
"brew:imagemagick" = "latest"
"brew:exiftool" = "latest"
"brew:media-info" = "latest" # installs mediainfo
"brew-cask:wezterm@nightly" = "latest"
"brew-cask:font-dejavu-sans-mono-nerd-font" = "latest"

[bootstrap.hooks]
# some mise tools still ship x86_64-only builds (e.g. hyperfine), so rosetta
# has to exist before anything is installed
pre-packages = "softwareupdate --install-rosetta --agree-to-license"
post-packages = ["brew install --cask aerospace"]
# dock settings only take effect after it restarts
post-defaults = "killall Dock || true"

# macOS preferences. Only settings that actually differ from stock macOS are
# listed - pinning a default just adds noise and hides the real intent.
#
# Apply with:
# $ mise bootstrap macos defaults apply
[bootstrap.macos.keyboard]
key_repeat = 5
initial_key_repeat = 15
# disable the accent picker so held keys repeat instead - required for
# vim-style navigation in neovim
press_and_hold = false

[bootstrap.macos.dock]
autohide = true
tilesize = 61
# aerospace requires this off, otherwise macOS reorders spaces underneath it
mru_spaces = false

[bootstrap.macos.trackpad]
tap_to_click = true

# Pick tools that renovate can manage updates for. See:
# https://docs.renovatebot.com/modules/manager/mise/
[tools]
# let renovate manage the version for mise itself. Note that in a new
# installation this is a chicken-and-egg issue, so mise will need to be
# bootstrapped with e.g. homebrew for the first installation.
"aqua:jdx/mise" = "2026.8.14"

# renovate: datasource=crate depName=bacon
