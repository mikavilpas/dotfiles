# yaml-language-server: $schema=https://gh-dash.dev/schema.json
defaults:
  preview:
    open: true
    width: 70
  prsLimit: 30
  issuesLimit: 30
  view: prs
  refetchIntervalMinutes: 5

prSections:
  - title: Renovate (github.com)
    filters: is:open author:app/renovate user:mikavilpas
  - title: Needs my review
    filters: is:open review-requested:@me -author:@me
  - title: My PRs
    filters: is:open author:@me
  - title: Involved
    filters: is:open involves:@me -author:@me -review-requested:@me

issuesSections:
  - title: Assigned
    filters: is:open assignee:@me
  - title: Created
    filters: is:open author:@me
  - title: Mentioned
    filters: is:open mentions:@me -author:@me

keybindings:
  prs:
    - key: S
      name: squash merge
      command: gh pr merge --squash --delete-branch=false --repo {{.RepoName}} {{.PrNumber}}
    - key: R
      name: rebase merge
      command: gh pr merge --rebase --delete-branch=false --repo {{.RepoName}} {{.PrNumber}}

pager:
  diff: delta

theme:
  colors:
    # https://github.com/catppuccin/gh-dash/blob/main/themes/macchiato/catppuccin-macchiato-flamingo.yml
    text:
      primary: "#cad3f5"
      secondary: "#f0c6c6"
      inverted: "#181926"
      faint: "#b8c0e0"
      warning: "#eed49f"
      success: "#a6da95"
      error: "#ed8796"
    background:
      selected: "#363a4f"
    border:
      primary: "#f0c6c6"
      secondary: "#494d64"
      faint: "#363a4f"
