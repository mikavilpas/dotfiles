# https://github.com/etrigan63/Catppuccin-starship/blob/main/user_starship.toml

# when displaying the nodejs version in the prompt, the initial call to node is
# slow. The subsequent calls are fast, so give the command a bit more time in
# the beginning.
#
# Using Node v22.13.0
# [WARN] - (starship::utils): Executing command "/Users/mikavilpas/.local/state/fnm_multishells/6152_1738395379087/bin/node" timed out.
# [WARN] - (starship::utils): You can set command_timeout in your config to a higher value to allow longer-running commands to keep executing.
command_timeout = 3000

palette = "catppuccin_mocha"
format = """
[](blue)\
$username\
[ ](fg:crust bg:blue)\
[](bg:text fg:blue)\
$directory\
[](fg:text bg:peach)\
$git_branch\
$git_state\
$git_status\
[](fg:peach bg:mauve)\
$nodejs\
$rust\
[](fg:mauve bg:teal)\
$aws\
$jobs\
$status\
[](fg:teal bg:blue)\
$time\
$cmd_duration\
[ ](fg:blue)\
\n$character"""

# Disable the blank line at the start of the prompt
# add_newline = false

# $username only renders as root or over SSH. Without this section it would fall
# back to starship's default format ("$user in ", bold yellow, no background),
# which breaks the blue cap of the prompt on every remote session.
[username]
style_user = "fg:crust bg:blue"
style_root = "fg:red bg:blue"
format = "[[ $user ](fg:crust bg:blue)]($style)"

[directory]
style = "fg:crust bg:text"
format = "[ $path ]($style)"
truncation_length = 100
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:crust bg:peach"
format = "[[ $symbol $branch ](fg:crust bg:peach)]($style)"

# Shows REBASING 2/5, MERGING, CHERRY-PICKING etc. Only renders mid-operation,
# so it costs nothing the rest of the time.
[git_state]
style = "fg:crust bg:peach"
format = "[[ $state( $progress_current/$progress_total) ](fg:crust bg:peach)]($style)"

[git_status]
style = "fg:crust bg:peach"
format = "[[($all_status$ahead_behind )](fg:crust bg:peach)]($style)"

[nodejs]
symbol = "󰎙"
style = "fg:crust bg:mauve"
format = "[[ $symbol ($version) ](fg:crust bg:mauve)]($style)"

[rust]
symbol = ""
style = "fg:crust bg:mauve"
format = "[[ $symbol ($version) ](fg:crust bg:mauve)]($style)"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:crust bg:blue"
format = "[[ 󱑎 $time ](fg:crust bg:blue)]($style)"

[cmd_duration]
min_time = 500
# format = 'underwent [$duration](bold yellow)'
style = "fg:crust bg:blue"
format = "[[  $duration ](fg:crust bg:blue)]($style)"

[jobs]
style = "fg:crust bg:teal"
symbol = "󰜎 "
number_threshold = 1
format = "[[ $symbol$number ](fg:crust bg:teal)]($style)"

[status]
style = "fg:crust bg:teal"
symbol = "🔴"
success_symbol = ""
format = "[[ $symbol$signal_name$int ](fg:crust bg:teal)]($style)"
map_symbol = true
disabled = false

[character]
format = "$symbol "
success_symbol = "\\$"
error_symbol = "[\\$](red)"
vimcmd_symbol = "[\\$](mauve)"

# force_display is required: without it the module never renders, because
# starship otherwise only shows it in directories it recognises as AWS-related.
# With it, the module still stays quiet unless a profile is actually active.
[aws]
force_display = true
format = "[[ $symbol$profile ](fg:crust bg:teal)]($style)"
style = "fg:crust bg:teal"
symbol = "󰸏 "
# [aws.profile_aliases]
# Enterprise_Naming_Scheme-voidstars = 'void**'

