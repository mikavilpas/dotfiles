# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Command_Keybindings.md#placeholder-values

worktree:
  defaultPath: ~/git/worktrees/
services:
  "gitlab.baronatechnologies.fi": "gitlab:gitlab.baronatechnologies.fi"
  "barona.ghe.com": "github:barona.ghe.com"
customCommands:
  - key: "<c-a>"
    context: "global"
    description: "Save everything as WIP"
    command: "git commit --all --no-verify --message 'WIP: work in progress'"
  - key: "I"
    # backspace does not work, tracked in
    # https://github.com/jesseduffield/lazygit/issues/2953
    # https://github.com/jesseduffield/lazygit/issues/3847
    context: global
    command: "git stash-keep"
  - key: "E"
    description: "Add empty commit"
    context: files
    command: 'git commit --allow-empty -m "{{.Form.CommitMessage}}"'
    loadingText: "Committing empty commit..."
    prompts:
      - type: input
        title: Empty commit message
        key: CommitMessage
        initialValue: "(empty commit)"
  - key: "b"
    context: localBranches
    description: "Backup branch"
    command: git backup-branch {{.SelectedLocalBranch.Name}}
  - key: "<f8>"
    context: localBranches
    description: "Autosquash only this branch (preserves fixups in branches above)"
    loadingText: "Autosquashing {{.SelectedLocalBranch.Name}}..."
    command: mika autosquash-branch run "{{.SelectedLocalBranch.Name}}"
  - key: "<c-r>"
    context: commits
    description: "Reword the commit with verbose=false"
    output: terminal
    command: "git -c commit.verbose=false commit --allow-empty --amend --only"
  - key: "Y"
    context: localBranches
    description: "Summarize branch commits for a PR"
    command: "mika branch-summary --branch '{{.SelectedLocalBranch.Name}}' | pbcopy"
  - key: "Y"
    context: reflogCommits,commits,subCommits
    description: "Summarize selected commits for a PR"
    command:
      "mika summary --from={{.SelectedCommitRange.To}} --to={{.SelectedCommitRange.From}}^ | prettier --no-config
      --parser markdown --prose-wrap never | pbcopy"
  - key: X
    description: Custom commands
    commandMenu:
      - key: c
        command:
          'echo "$(git rev-parse --show-toplevel) {{.SelectedCommitRange.From}} {{.SelectedCommitRange.To}}" | pbcopy'
        context: commits, subCommits
        description: "Copy selected commits to clipboard (paste in another local repo)"
      - key: v
        context: "commits"
        description: "Cherry-pick commits copied from another local repo"
        # Fetch the commits as real objects instead of applying a patch with
        # `git am`. Conflicts are then a normal cherry-pick, which lazygit can
        # continue and abort. A failed `git am` leaves .git/rebase-apply behind,
        # which lazygit mistakes for a rebase and cannot resolve.
        command: |
          #!/bin/bash
          set -euo pipefail

          # "<repo path> <oldest sha> <newest sha>", written by the copy command
          read -r repo from to <<<"$(pbpaste)"

          if [[ -z "${to:-}" || ! -d "$repo" ]]; then
            echo "Clipboard does not contain copied commits: $(pbpaste | head -c 200)" >&2
            exit 1
          fi

          git fetch --quiet --no-tags "$repo" "$to"
          git cherry-pick "$from^..$to"
      - key: s
        command:
          "mika share-patch --with-instructions --commit {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}} |
          pbcopy"
        description: "Share selected commits as a patch with instructions"
      - key: i
        context: commits
        description: "Replace the issue body with a summary of the selected commits"
        output: terminal
        command: rewrite-issue-description "{{.SelectedCommitRange.From}}" "{{.SelectedCommitRange.To}}"
      - key: w
        command: ~/.config/lazygit/git-create-worktree.sh "{{.SelectedLocalBranch.Name}}"
        context: localBranches
        output: terminal
        description: "Create worktree for the selected branch"
      - key: r
        description: Rebase to the selected branch without Ataraxy-Labs/weave
        # Issue:
        #
        # https://github.com/Ataraxy-Labs/weave sometimes creates large diffs -
        # in these cases it's very difficult to resolve a conflict.
        #
        # Solution:
        #
        # Provide this mapping to rebase the current branch to the selected
        # branch without Ataraxy-Labs/weave. In these cases the normal git
        # conflict is sometimes much easier to resolve.
        context: localBranches
        command:
          git -c core.attributesFile=/dev/null rebase --autostash --keep-empty --no-autosquash --rebase-merges
          "{{.SelectedLocalBranch.Name}}"
      - key: p
        description: Create PR
        context: localBranches
        prompts:
          - type: menu
            title: Select the merge strategy
            key: MergeStrategy
            options:
              - name: Squash
                value: "gh pr merge '{{.SelectedLocalBranch.Name}}' --auto --squash --delete-branch"
              - name: Rebase
                value: "gh pr merge '{{.SelectedLocalBranch.Name}}' --auto --rebase --delete-branch"

        command: |
          #!/bin/bash
          set -euo pipefail

          BRANCH="{{.SelectedLocalBranch.Name}}"
          REMOTE_NAME="$(git config "branch.$BRANCH.remote" || true)"
          if [[ -z "$REMOTE_NAME" ]]; then
            echo "Branch $BRANCH does not track a remote, cannot create PR" >&2
            exit 1
          fi

          REMOTE_URL="$(git remote get-url "$REMOTE_NAME")"
          if [[ "$REMOTE_URL" == *"github"* || "$REMOTE_URL" == *"ghe.com"* ]]; then
            # no --base: gh targets the repo's default branch (main, master, ...)
            PR=$(gh pr create --fill --head "$BRANCH" --assignee "@me")
            echo "Created PR: $PR"
            ~/.config/lazygit/update-pr-description.sh "$BRANCH" # set the formatted description
            open "$PR" # open it in the browser
            {{.Form.MergeStrategy}}
          else
            echo "Unsupported forge for PR creation: $REMOTE_URL" >&2
            exit 1
          fi
  - key: "="
    description: "Update MR/PR description"
    context: localBranches
    output: log
    command: ~/.config/lazygit/update-pr-description.sh "{{.SelectedLocalBranch.Name}}"
  - key: "T"
    context: worktrees
    description: Open worktree in wezterm tab
    command: ~/.config/yazi/scripts/open-wezterm-tabs.sh '{{.SelectedWorktree.Path}}'
keybinding:
  universal:
    edit: e
    prevTab: ö
    nextTab: ä
  files:
    commitChanges: C # using the interactive commit dialog
    commitChangesWithEditor: c # using neovim
    toggleTreeView: f
os:
  # I usually use lazygit embedded in nvim. For this, I use
  # https://github.com/willothy/flatten.nvim to simplify the setup without the
  # need for external applications.
  #
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  # Create pull request command opens a URL with incorrect escaping #3064
  # https://github.com/jesseduffield/lazygit/issues/3064
  openLink: open -n "$(echo {{link}} | sed 's/%3E/>/g' | sed 's/%2F/\//g' | sed s/%27/\'/g )"
promptToReturnFromSubprocess: false
notARepository: "quit"
# https://github.com/catppuccin/lazygit/blob/main/themes-mergable/macchiato/pink.yml
gui:
  commitHashLength: 0
  skipRewordInEditorWarning: true
  nerdFontsVersion: "3"
  scrollHeight: 10
  mainPanelSplitMode: vertical
  showDivergenceFromBaseBranch: arrowAndNumber
  theme:
    activeBorderColor:
      - "#f5bde6"
      - bold
    inactiveBorderColor:
      - "#a5adcb"
    optionsTextColor:
      - "#8aadf4"
    selectedLineBgColor:
      - "#c6a0f6" # catppuccin-macchiato-mauve
    # dark text so it stays readable on the bright background
    selectedLineFgColor:
      - "#24273a" # catppuccin-macchiato-base
      - bold
    inactiveViewSelectedLineBgColor:
      - "#6e738d"
    cherryPickedCommitBgColor:
      - "#494d64"
    cherryPickedCommitFgColor:
      - "#f5bde6"
    markedBaseCommitFgColor:
      - "#8aadf4"
    markedBaseCommitBgColor:
      - "#eed49f"
    unstagedChangesColor:
      - "#ed8796"
    defaultFgColor:
      - "#cad3f5"
    searchingActiveBorderColor:
      - "#eed49f"
    authorColors:
      "Mika Vilpas": "#f0c6c6" # catppuccin-macchiato-flamingo
    branchColorPatterns:
      # https://catppuccin.com/palette/

      # my "git backup-branch" branches should show up in a darker color
      ".+?--backup": "#6e738d"
      "renovate/.+": "#cba6f7" # catppuccin-mocha-mauve
      "main$": "#a6da95"
      "master$": "#a6da95"
      "wip-.+": "#7dc4e4" # catppuccin-macchiato-sapphire
      "feature/.+": "#f5e0dc" # catppuccin-mocha-rosewater
  showNumstatInFilesView: true
git:
  mainBranches: [master, main, development]
  parseEmoji: true
  diffRenderers:
    # switch with `|`
    - colorArg: always
      command: delta --paging=never
      name: delta
    - colorArg: always
      # doesn't fully color everything but might be useful for some cases where
      # I need to eyeball a long branch commit log
      command: bat --paging=never --color=always --style=plain --language=markdown --paging=never --decorations=never
      name: bat
  ignoreWhitespaceInDiffView: true
# useful for e2e tests. They don't have a separate configuration right now, so
# this needs to be specified here.
disableStartupPopups: true
